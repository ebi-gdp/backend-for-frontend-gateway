# Service name
serviceName: backend-for-frontend

# Namespace
namespace: intervene-dev

# Environment-specific variables
env:
  profile: "gcp-dev-env"

# Replica count for development
replicaCount: 1

# Image details
image:
  repository: dockerhub.ebi.ac.uk/gdp/backend-for-frontend-gateway
  tag: 0.0.1
  tagPostfix: dev
  pullPolicy: Always

# Service account
serviceAccount: ksa-cloud-sql

# Application properties file
properties:
  fileName: "application-gcp-dev-env.properties"

# Kubernetes resource limits for development
resources:
  limits:
    cpu: "1"
    memory: "512Mi"
  requests:
    cpu: "0.5"
    memory: "256Mi"

# Java jvm memory size
java:
  maxSize: -Xmx256m

# GCP project details
gcp:
  projectName: "prj-ext-dev-intervene-413412"
  zone: "europe-west2"
  dbName: "intervene"

# GCP cloud sql proxy resource
cloudSql:
  resources:
    limits:
      cpu: "0.5"
      memory: "500Mi"
    requests:
      cpu: "0.3"
      memory: "300Mi"
